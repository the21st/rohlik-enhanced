name: Release

# Push a tag that matches the manifest version, e.g.:
#   git tag v1.11.0 && git push origin v1.11.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate only, do not publish"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Check that the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for manifest in manifest.firefox.json manifest.chrome.json; do
            version=$(node -p "require('./$manifest').version")
            if [ "$version" != "$tag" ]; then
              echo "::error::$manifest is $version but the tag is $tag"
              exit 1
            fi
          done
          echo "Releasing version $tag"

      - name: Build packages
        run: npm run package:all

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            rohlik-enhanced-firefox.zip
            rohlik-enhanced-chrome.zip

      - name: Publish to Firefox Add-ons
        if: ${{ !inputs.dry_run }}
        env:
          JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          cp manifest.firefox.json manifest.json
          npx --yes web-ext sign \
            --source-dir . \
            --ignore-files node_modules "*.zip" "*.xlsx" "*.test.js" \
              "CLAUDE.md" "README.md" "package.json" "package-lock.json" \
              "manifest.firefox.json" "manifest.chrome.json" \
              "web-ext-artifacts/**" \
            --api-key="$JWT_ISSUER" \
            --api-secret="$JWT_SECRET" \
            --channel=listed

      # Chrome stays manual on purpose: its API needs Google Cloud OAuth
      # credentials, which is not worth the upkeep at this release rate.
      # Upload rohlik-enhanced-chrome.zip from the release page to
      # https://chrome.google.com/webstore/devconsole
      - name: Remind about the Chrome upload
        if: ${{ !inputs.dry_run }}
        run: |
          echo "::notice::Chrome is manual. Upload rohlik-enhanced-chrome.zip from this release to the Web Store dashboard."

      - name: Create the GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            rohlik-enhanced-firefox.zip \
            rohlik-enhanced-chrome.zip \
            web-ext-artifacts/*.xpi
