name: Release

# Push a tag that matches the manifest version, e.g.:
#   git tag v1.11.0 && git push origin v1.11.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate only, do not publish"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Check that the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for manifest in manifest.firefox.json manifest.chrome.json; do
            version=$(node -p "require('./$manifest').version")
            if [ "$version" != "$tag" ]; then
              echo "::error::$manifest is $version but the tag is $tag"
              exit 1
            fi
          done
          echo "Releasing version $tag"

      - name: Build packages
        run: npm run package:all

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            rohlik-enhanced-firefox.zip
            rohlik-enhanced-chrome.zip

      - name: Publish to Firefox Add-ons
        if: ${{ !inputs.dry_run }}
        env:
          JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          cp manifest.firefox.json manifest.json
          npx --yes web-ext sign \
            --source-dir . \
            --ignore-files node_modules "*.zip" \
            --api-key="$JWT_ISSUER" \
            --api-secret="$JWT_SECRET" \
            --channel=listed

      - name: Publish to the Chrome Web Store
        if: ${{ !inputs.dry_run }}
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          npx --yes chrome-webstore-upload-cli@3 upload \
            --source rohlik-enhanced-chrome.zip \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN" \
            --auto-publish

      - name: Create the GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            rohlik-enhanced-firefox.zip \
            rohlik-enhanced-chrome.zip \
            web-ext-artifacts/*.xpi
